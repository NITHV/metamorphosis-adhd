# Brain Dump Android app: CI on every change, signed release on every android-v* tag.
# Design: docs/brain-dump-android/system-design.md §9 ("Release pipeline").
name: Android

on:
  push:
    branches: [main]
    paths: ["apps/brain-dump-android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"] # path filters don't apply to tag pushes
  pull_request:
    paths: ["apps/brain-dump-android/**", ".github/workflows/android.yml"]

permissions:
  contents: write # needed to create GitHub Releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: apps/brain-dump-android

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned: the build machine changes only when we decide
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: apps/brain-dump-android/app/build/reports/
          retention-days: 14

      # ---------------- Release (tags only) ----------------

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag android-v$tag does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=braindump\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          BRAIN_DUMP_KEYSTORE_PROPERTIES="$RUNNER_TEMP/keystore.properties" ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties"

      - name: Verify signature and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          apk="brain-dump-${GITHUB_REF_NAME#android-v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --print-certs "$apk" | grep -i "SHA-256"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Brain Dump for Android ${GITHUB_REF_NAME#android-v}" \
            --notes "Install: open this page on your Android phone, tap the .apk file, and allow installs from your browser if asked. Your data stays on the phone."
